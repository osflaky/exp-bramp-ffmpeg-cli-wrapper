name: Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - java-version: 17
          os: windows-latest
          arch: x64
          runner: windows-latest
          expander_leg: windows-latest-17-x64
    name: Test JDK ${{ matrix.java-version }} [${{ matrix.expander_leg }}]

    steps:
    - uses: actions/checkout@v7

    - name: Set up FFmpeg
      uses: Wandalen/wretry.action@v3.8.0
      with:
        action: FedericoCarboni/setup-ffmpeg@v3
        attempt_limit: 3
        attempt_delay: 5000
        with: '{ "ffmpeg-version": "release" }'

    - name: Set up JDK ${{ matrix.java-version }}
      uses: actions/setup-java@v6.0.1
      with:
        java-version: ${{ matrix.java-version }}
        distribution: 'temurin'
        cache: maven

    - name: Test with Maven
      run: mvn --batch-mode verify -Dgpg.skip

    - name: Check EXAMPLES.md is up to date
      if: matrix.java-version == '21'
      run: |
        python3 tools/generate_examples.py
        if ! git diff --quiet EXAMPLES.md README.md; then
          echo "::error::EXAMPLES.md or README.md is out of date. Run 'make examples' and commit the result."
          git diff EXAMPLES.md README.md
          exit 1
        fi

    - name: Update dependency graph
      if: matrix.java-version == '21' && github.event_name == 'push'
      uses: advanced-security/maven-dependency-submission-action@v6
      continue-on-error: true
    timeout-minutes: 150
